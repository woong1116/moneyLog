<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <title>머니로그 - 거래내역</title>
</head>
<body>
<h1>거래내역</h1>
<a href="statistics.html">월별 통계 보기</a>

<!-- 거래 등록 폼 -->
<h2>새 거래 등록</h2>
<form id="txForm">
    <select id="type">
        <option value="EXPENSE">지출</option>
        <option value="INCOME">수입</option>
    </select>
    <input type="number" id="amount" placeholder="금액(원)" min="1" required />
    <input type="number" id="categoryId" placeholder="카테고리ID" required />
    <input type="text" id="description" placeholder="내용" />
    <input type="date" id="transactionDate" required />
    <button type="submit">등록</button>
</form>
<p id="msg" style="color:red"></p>

<!-- 목록 테이블 -->
<h2>이번 달 목록</h2>
<p id="pageInfo"></p>
<table border="1">
    <thead>
    <tr><th>날짜</th><th>타입</th><th>금액</th><th>내용</th></tr>
    </thead>
    <tbody id="txBody"></tbody>
</table>

<script src="api.js"></script>
<script>
    requireLogin(); // 미로그인 시 로그인 페이지로

    // 이번 달 yearMonth 문자열 ("2026-07")
    const now = new Date();
    const yearMonth = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}`;

    // 목록 불러와 표 그리기
    async function loadTransactions() {
        const body = await apiFetch(`/api/transactions?yearMonth=${yearMonth}`);
        // 공통 응답 형식: 실제 목록은 body.data.transactions, 페이지 정보는 body.meta.pagination
        const list = body.data.transactions;
        const page = body.meta?.pagination;

        const tbody = document.getElementById("txBody");
        tbody.innerHTML = "";
        list.forEach((t) => {
            const tr = document.createElement("tr");
            tr.innerHTML = `
          <td>${t.transactionDate}</td>
          <td>${t.type === "INCOME" ? "수입" : "지출"}</td>
          <td>${t.amount.toLocaleString()}원</td>
          <td>${t.description ?? ""}</td>`;
            tbody.appendChild(tr);
        });

        // 페이지네이션 meta가 있으면 총 개수/다음 페이지 유무를 간단히 표시
        if (page) {
            document.getElementById("pageInfo").textContent =
                `총 ${page.totalItems}건 · ${page.page + 1}/${page.totalPages}쪽` +
                (page.hasNext ? " · 다음 페이지 있음" : "");
        }
    }

    // 새 거래 등록
    document.getElementById("txForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const body = {
            type: document.getElementById("type").value,
            amount: Number(document.getElementById("amount").value),
            categoryId: Number(document.getElementById("categoryId").value),
            description: document.getElementById("description").value,
            transactionDate: document.getElementById("transactionDate").value,
        };
        try {
            await apiFetch("/api/transactions", {
                method: "POST",
                body: JSON.stringify(body),
            });
            e.target.reset();
            await loadTransactions(); // 등록 후 목록 갱신
        } catch (err) {
            document.getElementById("msg").textContent = err.message;
        }
    });

    loadTransactions(); // 첫 로드
</script>
</body>
</html>
