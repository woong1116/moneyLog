<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>머니로그 - 로그인</title>
</head>
<body>
<h1>머니로그 로그인</h1>
<form id="loginForm">
  <input type="email" id="email" placeholder="이메일" required />
  <input type="password" id="password" placeholder="비밀번호" required />
  <button type="submit">로그인</button>
</form>
<p id="msg" style="color:red"></p>

<script>
  // 백엔드 API의 기본 주소 (배포 시 실제 도메인으로 교체)
  const API_BASE = "http://localhost:8080";

  document.getElementById("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault(); // 폼 기본 제출(새로고침) 막기

    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    try {
      const res = await fetch(`${API_BASE}/api/auth/login`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, password }),
      });

      // 성공/에러 모두 공통 응답 형식으로 응답: {success, message, data, (code)}
      const body = await res.json();

      if (!res.ok || body.success === false) {
        // 에러 응답 형식: {success:false, code, message, data:null}
        throw new Error(body.message || "로그인 실패");
      }

      // 토큰은 응답의 data 안에 있음: body.data.accessToken
      localStorage.setItem("accessToken", body.data.accessToken); // 토큰 저장
      location.href = "transactions.html"; // 목록 화면으로 이동
    } catch (err) {
      document.getElementById("msg").textContent = err.message;
    }
  });
</script>
</body>
</html>
