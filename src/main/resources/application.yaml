spring:
  profiles:
    active: local          # 기본 활성 프로파일

  jpa:
    hibernate:
      ddl-auto: update     # 로컬 개발 편의(운영은 validate/none 권장)
    properties:
      hibernate:
        format_sql: true
    open-in-view: false    # 지연로딩 관련 문제 예방(권장)

springdoc:
  swagger-ui:
    path: /swagger-ui.html

---
# ===== 로컬 프로파일 (H2 인메모리) =====
spring:
  config:
    activate:
      on-profile: local

  datasource:
    url: jdbc:h2:mem:moneylog;MODE=MySQL   # MySQL 문법 호환 모드
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true        # http://localhost:8080/h2-console
      path: /h2-console

  jpa:
    show-sql: true

---
# ===== 운영 프로파일 (MySQL 8) =====
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update      # 캡스톤 편의상 update, 실무는 Flyway 등 마이그레이션 권장
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

jwt:
  secret: ${JWT_SECRET:dGVzdC1zZWNyZXQta2V5LWZvci1sb2NhbC1kZXYtb25seS0zMmJ5dGVzIQ==}
  expiration-ms: ${JWT_EXPIRATION_MS:3600000}