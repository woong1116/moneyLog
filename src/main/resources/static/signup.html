<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>머니로그 - 회원가입</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="auth">
<div class="auth-card">
  <h1>머니로그 회원가입</h1>
  <form id="signupForm">
    <div class="field">
      <label for="email">이메일</label>
      <input type="email" id="email" placeholder="you@example.com" required />
    </div>
    <div class="field">
      <label for="password">비밀번호</label>
      <input type="password" id="password" placeholder="8~64자" minlength="8" maxlength="64" required />
    </div>
    <div class="field">
      <label for="nickname">닉네임</label>
      <input type="text" id="nickname" placeholder="닉네임" required />
    </div>
    <button type="submit">회원가입</button>
  </form>
  <p id="msg" class="msg"></p>
  <p class="switch-link"><a href="login.html">이미 계정이 있으신가요? 로그인</a></p>
</div>

<script>
  // 빈 문자열 = 이 페이지를 서빙한 origin으로 요청 (localhost든 배포 서버든 자동으로 맞음)
  const API_BASE = "";

  document.getElementById("signupForm").addEventListener("submit", async (e) => {
    e.preventDefault(); // 폼 기본 제출(새로고침) 막기

    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;
    const nickname = document.getElementById("nickname").value;

    try {
      const res = await fetch(`${API_BASE}/api/auth/signup`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, password, nickname }),
      });

      // 성공/에러 모두 공통 응답 형식으로 응답: {success, message, data, (code)}
      const body = await res.json();

      if (!res.ok || body.success === false) {
        // 에러 응답 형식: {success:false, code, message, data:null}
        throw new Error(body.message || "회원가입 실패");
      }

      // 가입 성공 시 바로 로그인 화면으로 이동
      location.href = "login.html";
    } catch (err) {
      document.getElementById("msg").textContent = err.message;
    }
  });
</script>
</body>
</html>
