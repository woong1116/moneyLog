<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>머니로그 - 로그인</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="auth">
<div class="auth-card">
  <h1>머니로그 로그인</h1>
  <form id="loginForm">
    <div class="field">
      <label for="email">이메일</label>
      <input type="email" id="email" placeholder="you@example.com" required />
    </div>
    <div class="field">
      <label for="password">비밀번호</label>
      <input type="password" id="password" placeholder="비밀번호" required />
    </div>
    <button type="submit">로그인</button>
  </form>
  <p id="msg" class="msg"></p>
  <p class="switch-link"><a href="signup.html">계정이 없으신가요? 회원가입</a></p>
</div>

<script>
  // 빈 문자열 = 이 페이지를 서빙한 origin으로 요청 (localhost든 배포 서버든 자동으로 맞음)
  const API_BASE = "";

  document.getElementById("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault(); // 폼 기본 제출(새로고침) 막기

    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    try {
      const res = await fetch(`${API_BASE}/api/auth/login`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, password }),
      });

      // 성공/에러 모두 공통 응답 형식으로 응답: {success, message, data, (code)}
      const body = await res.json();

      if (!res.ok || body.success === false) {
        // 에러 응답 형식: {success:false, code, message, data:null}
        throw new Error(body.message || "로그인 실패");
      }

      // 토큰은 응답의 data 안에 있음: body.data.accessToken
      localStorage.setItem("accessToken", body.data.accessToken); // 토큰 저장
      location.href = "transactions.html"; // 목록 화면으로 이동
    } catch (err) {
      document.getElementById("msg").textContent = err.message;
    }
  });
</script>
</body>
</html>
